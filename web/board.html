<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sacramento Departures</title>
<style>
  @font-face {
    font-family: "ChakraPetch";
    src: url("/font.ttf") format("truetype");
    font-weight: normal; font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: "ChakraPetch", system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Drawing buffer is 800x480; CSS scales it to fit the screen, aspect kept. */
  canvas { background: #000; image-rendering: auto; }

  /* 511-key prompt overlay (amber-on-black, touch-friendly) */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex;
    align-items: center; justify-content: center; background: rgba(0,0,0,.88); }
  .overlay[hidden] { display: none; }
  .modal { width: 660px; max-width: 94vw; color: #FFC800; text-transform: uppercase;
    border: 2px solid #FFC800; border-radius: 10px; padding: 20px 22px; background: #000; }
  .mtitle { font-size: 30px; font-weight: 700; letter-spacing: .5px; }
  .msub { font-size: 15px; color: #c79e12; margin: 8px 0 14px; line-height: 1.35;
    text-transform: none; }
  .keyinput { width: 100%; box-sizing: border-box; font-family: inherit;
    font-size: 22px; letter-spacing: 2px; color: #FFC800; background: #1a1407;
    border: 2px solid #FFC800; border-radius: 6px; padding: 10px 12px; outline: none; }
  .keyinput::placeholder { color: #7a6310; letter-spacing: 1px; }
  .keypad { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin: 12px 0; }
  .kkey { font-family: inherit; font-size: 20px; color: #FFC800; background: #000;
    border: 2px solid #6b5408; border-radius: 6px; padding: 8px 0; cursor: pointer; }
  .kkey:active { background: #FFC800; color: #000; }
  .kkey.wide { grid-column: span 2; }
  .kstatus { font-size: 15px; min-height: 20px; text-transform: none; color: #FFC800; }
  .mbtns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; }
  .btn { font-family: inherit; font-size: 20px; font-weight: 700; padding: 10px 22px;
    border-radius: 6px; cursor: pointer; border: 2px solid #FFC800;
    background: #FFC800; color: #000; }
  .btn.ghost { background: #000; color: #FFC800; }
</style>
</head>
<body>
<canvas id="board" width="800" height="480"></canvas>

<!-- Shown when no 511 key is stored: offer to add one, or decline. -->
<div id="keymodal" class="overlay" hidden>
  <div class="modal">
    <div class="mtitle">Add a 511 key?</div>
    <div class="msub">A free 511.org key unlocks the full Capitol&nbsp;Corridor &amp;
      San&nbsp;Joaquins schedules. Without it, the board still works but shows only
      trains Amtrak is actively tracking. Get a key at 511.org/open-data/token.</div>
    <input id="keyinput" class="keyinput" type="text" inputmode="text"
      autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="paste or tap your key">
    <div id="keypad" class="keypad"></div>
    <div id="keystatus" class="kstatus"></div>
    <div class="mbtns">
      <button id="declinebtn" class="btn ghost">Not now</button>
      <button id="savebtn" class="btn">Save key</button>
    </div>
  </div>
</div>

<script>
// ---- Look: must mirror render_board.py ------------------------------------
const W = 800, H = 480;
const AMBER = "#FFC800", RED = "#FF4B23";
const FONT = "ChakraPetch";
const TITLE_SIZE = 36, UPD_SIZE = 13, HEAD_SIZE = 20, ROW_SIZE = 24;
const COL_TIME = 16, COL_ROUTE = 190, COL_TO = 448, RIGHT = W - 16;
const HEAD_Y = 70, LINE_Y = 100, ROWS_TOP = 112, ROW_H = 44, MAX_ROWS = 8;

// ---- Split-flap behavior --------------------------------------------------
// Flaps only advance FORWARD through this sequence (like a real Solari board),
// so the distance from the old glyph to the new one sets how long a cell spins.
const FLAP = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:+-./→";
const FLAP_IDX = Object.fromEntries([...FLAP].map((c, i) => [c, i]));
const MS_PER_FLAP = 57;         // time to advance one glyph (~2/3 speed)
const STAGGER_MS_PER_PX = 1.05; // left-to-right wave: later columns start later
let SEAM_OFF = 10;              // px from row top to the flap hinge; set from
                               // real glyph metrics in computeSeam() on load

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + "px";
  canvas.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit);
fit();

// ---- State ----------------------------------------------------------------
let shown = {};        // id -> glyph currently settled/displayed
let cells = [];        // current animation target cells
let animStart = 0;     // performance.now() when the current animation began
let animating = false;
let updatedText = "";
let updatedAge = 0;            // seconds since the shown data was fetched
let connected = false;        // true once we've received any board
let lastRowsKey = null;
const STALE_AFTER = 150;       // show an "old" badge past this age (one missed refresh)

function setFont(size) { ctx.font = size + "px " + FONT; }

// Turn a list of {t,color} segments into per-character {ch,color}.
function segChars(segs) {
  const out = [];
  for (const s of segs) for (const ch of s.t) out.push({ ch, color: s.color });
  return out;
}

// Build the target cells for all rows. Left-aligned fields advance by each
// TARGET glyph's width so intermediate glyphs sit at the final position.
function buildCells(rows) {
  const out = [];
  setFont(ROW_SIZE);
  rows.forEach((row, r) => {
    const y = ROWS_TOP + r * ROW_H;
    const rowColor = row.late ? RED : AMBER;

    // TIME (left): sched amber, optional " -> revised" with revised in red.
    let timeChars;
    if (row.revised) {
      timeChars = segChars([
        { t: row.sched, color: AMBER },
        { t: " → ", color: AMBER },
        { t: row.revised, color: RED },
      ]);
    } else {
      timeChars = segChars([{ t: row.sched, color: AMBER }]);
    }
    pushLeft(out, r, "time", COL_TIME, y, timeChars);
    pushLeft(out, r, "route", COL_ROUTE, y, strChars(row.route, rowColor));
    pushLeft(out, r, "dest", COL_TO, y, strChars(row.dest, rowColor));
    pushRight(out, r, "status", RIGHT, y, strChars(row.status, rowColor));
  });
  return out;
}

function strChars(s, color) { return [...s].map(ch => ({ ch, color })); }

function pushLeft(out, r, field, anchorX, y, chars) {
  let x = anchorX;
  chars.forEach((c, i) => {
    out.push({ id: r + ":" + field + ":" + i, x, y, ch: c.ch, color: c.color });
    x += ctx.measureText(c.ch).width;
  });
}

// Right-aligned: id by index-from-right so trailing glyphs stay put when the
// string length changes (e.g. "ON TIME" -> "SCHEDULED").
function pushRight(out, r, field, anchorX, y, chars) {
  const total = chars.reduce((w, c) => w + ctx.measureText(c.ch).width, 0);
  let x = anchorX - total;
  const n = chars.length;
  chars.forEach((c, i) => {
    out.push({ id: r + ":" + field + ":R" + (n - 1 - i), x, y, ch: c.ch, color: c.color });
    x += ctx.measureText(c.ch).width;
  });
}

function startAnimation(rows) {
  cells = buildCells(rows);
  for (const cell of cells) {
    const from = shown[cell.id] ?? " ";
    const sIdx = FLAP_IDX[from] ?? 0;
    const tIdx = FLAP_IDX[cell.ch];
    if (tIdx === undefined) {           // glyph outside the flap set: no spin
      cell.sIdx = 0; cell.steps = 0; cell.fixed = cell.ch;
    } else {
      cell.sIdx = sIdx;
      cell.steps = (tIdx - sIdx + FLAP.length) % FLAP.length;
    }
    cell.startAt = cell.x * STAGGER_MS_PER_PX;  // relative to animStart
  }
  animStart = performance.now();
  if (!animating) { animating = true; requestAnimationFrame(frame); }
}

function drawChrome() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "top";
  ctx.fillStyle = AMBER;

  ctx.textAlign = "left";
  setFont(TITLE_SIZE);
  ctx.fillText("SACRAMENTO DEPARTURES", 16, 10);

  // "updated H:MM AM", plus a red "· Nm OLD" badge when the data is stale
  // (a fetch has been failing — wifi/feed down).
  ctx.textAlign = "right";
  setFont(UPD_SIZE);
  if (updatedAge >= STALE_AFTER) {
    const badge = " · " + Math.round(updatedAge / 60) + "m OLD";
    ctx.fillStyle = RED;
    ctx.fillText(badge, RIGHT, 22);
    ctx.fillStyle = AMBER;
    ctx.fillText(updatedText, RIGHT - ctx.measureText(badge).width, 22);
  } else {
    ctx.fillStyle = AMBER;
    ctx.fillText(updatedText, RIGHT, 22);
  }

  ctx.fillStyle = AMBER;
  ctx.textAlign = "left";
  setFont(HEAD_SIZE);
  ctx.fillText("DEPART", COL_TIME, HEAD_Y);
  ctx.fillText("ROUTE", COL_ROUTE, HEAD_Y);
  ctx.fillText("TO", COL_TO, HEAD_Y);
  ctx.textAlign = "right";
  ctx.fillText("STATUS", RIGHT, HEAD_Y);

  ctx.strokeStyle = AMBER; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(12, LINE_Y); ctx.lineTo(W - 12, LINE_Y); ctx.stroke();
}

// --- Split-flap card rendering --------------------------------------------
// Hinge = the true vertical center of the caps, measured from real glyph ink
// (textBaseline "top" leaves blank space above the caps, so the box middle
// would sit too low).
function computeSeam() {
  setFont(ROW_SIZE);
  const prev = ctx.textBaseline;
  ctx.textBaseline = "top";
  const m = ctx.measureText("ACEHMW0289");
  ctx.textBaseline = prev;
  if (m.actualBoundingBoxAscent != null && m.actualBoundingBoxDescent != null) {
    SEAM_OFF = (-m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) / 2;
  }
}

function drawSeam(x, w, sy) {
  ctx.fillStyle = "#000";
  ctx.fillRect(x - 1, sy, w + 2, 1);   // thin dark gap between the two flaps
}

// Draw one clipped half of a glyph, scaled vertically about the seam (so it
// folds toward/away from the hinge). isTop selects the upper or lower half.
function drawHalf(g, x, y, isTop, scaleY, seam, color) {
  if (g === " " || scaleY <= 0) return;
  const clipY = isTop ? y : seam;
  const clipH = isTop ? (seam - y) : (y + ROW_SIZE - seam);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - 1, clipY, ctx.measureText(g).width + 2, clipH);
  ctx.clip();
  ctx.translate(0, seam); ctx.scale(1, scaleY); ctx.translate(0, -seam);
  ctx.fillStyle = color;
  ctx.fillText(g, x, y);
  ctx.restore();
}

// One flap turning from `fromG` to `toG`, progress p in [0,1]: the old top
// folds down to the hinge (first half), then the new bottom folds in (second).
function drawFlip(x, y, fromG, toG, p, color) {
  const seam = y + SEAM_OFF;
  drawHalf(toG, x, y, true, 1, seam, color);     // new top, already settled behind
  drawHalf(fromG, x, y, false, 1, seam, color);  // old bottom, still showing
  if (p < 0.5) drawHalf(fromG, x, y, true, 1 - 2 * p, seam, color);  // old top folds down
  else drawHalf(toG, x, y, false, 2 * p - 1, seam, color);          // new bottom folds in
  drawSeam(x, Math.max(ctx.measureText(fromG).width, ctx.measureText(toG).width), seam);
}

// A settled glyph, drawn as a flap card (with the hinge seam).
function drawGlyph(g, x, y, color) {
  if (g === " ") return;
  ctx.fillStyle = color;
  ctx.fillText(g, x, y);
  drawSeam(x, ctx.measureText(g).width, y + SEAM_OFF);
}

function frame(now) {
  drawChrome();
  setFont(ROW_SIZE);
  ctx.textAlign = "left";
  ctx.textBaseline = "top";

  let allSettled = true;
  for (const cell of cells) {
    if (cell.fixed !== undefined) { drawGlyph(cell.fixed, cell.x, cell.y, cell.color); continue; }
    const t = now - animStart - cell.startAt;
    if (t <= 0) {
      if (cell.steps > 0) allSettled = false;
      drawGlyph(FLAP[cell.sIdx], cell.x, cell.y, cell.color);  // old glyph, awaiting its turn
      continue;
    }
    const fpos = t / MS_PER_FLAP, floor = Math.floor(fpos);
    if (floor >= cell.steps) {
      drawGlyph(cell.ch, cell.x, cell.y, cell.color);          // settled
    } else {
      allSettled = false;
      const fromG = FLAP[(cell.sIdx + floor) % FLAP.length];
      const toG = FLAP[(cell.sIdx + floor + 1) % FLAP.length];
      drawFlip(cell.x, cell.y, fromG, toG, fpos - floor, cell.color);
    }
  }

  if (allSettled) {
    animating = false;
    shown = {};
    for (const cell of cells) shown[cell.id] = (cell.fixed !== undefined ? cell.fixed : cell.ch);
  } else {
    requestAnimationFrame(frame);
  }
}

// Redraw the settled board without animating (used when only "updated" changed).
function frameStatic() {
  setFont(ROW_SIZE); ctx.textAlign = "left"; ctx.textBaseline = "top";
  for (const cell of cells) {
    drawGlyph(cell.fixed !== undefined ? cell.fixed : cell.ch, cell.x, cell.y, cell.color);
  }
}

// Tap / click anywhere to replay the flap (nice on the touchscreen, and a demo).
canvas.addEventListener("pointerdown", () => {
  if (cells.length && !animating) { shown = {}; startAnimation(lastRows()); }
});
let _lastRows = [];
function lastRows() { return _lastRows; }

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function fetchData() {
  const r = await fetch("/data.json", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function applyData(d) {
  connected = true;
  updatedText = d.updated;
  updatedAge = d.age_sec || 0;
  _lastRows = d.rows;
  const rk = JSON.stringify(d.rows);
  if (rk !== lastRowsKey) { lastRowsKey = rk; startAnimation(d.rows); }
  else if (!animating) { drawChrome(); frameStatic(); }

  // No 511 key stored? Offer to add one (once per app-open; dismiss persists
  // for the session). If a key appears (entered or set elsewhere), close it.
  if (d.has_key === false && !keyPromptDismissed && keymodal.hidden) showKeyPrompt();
  else if (d.has_key && !keymodal.hidden) hideKeyPrompt();
}

// ---- 511-key prompt -------------------------------------------------------
const keymodal = document.getElementById("keymodal");
const keyinput = document.getElementById("keyinput");
const keystatus = document.getElementById("keystatus");
let keyPromptDismissed = false;

(function buildKeypad() {
  const pad = document.getElementById("keypad");
  const add = (label, fn, wide) => {
    const b = document.createElement("button");
    b.className = "kkey" + (wide ? " wide" : "");
    b.textContent = label;
    b.addEventListener("click", fn);
    pad.appendChild(b);
  };
  for (const ch of "1234567890abcdef-") add(ch, () => { keyinput.value += ch; });
  add("⌫", () => { keyinput.value = keyinput.value.slice(0, -1); });
  add("Clear", () => { keyinput.value = ""; }, true);
})();

function showKeyPrompt() {
  keyinput.value = ""; keystatus.textContent = "";
  keymodal.hidden = false;
  keyinput.focus();
}
function hideKeyPrompt() { keymodal.hidden = true; }

document.getElementById("declinebtn").addEventListener("click", () => {
  keyPromptDismissed = true; hideKeyPrompt();
});
document.getElementById("savebtn").addEventListener("click", async () => {
  const key = keyinput.value.trim();
  if (!key) { keystatus.textContent = "Enter a key first."; return; }
  keystatus.textContent = "Saving…";
  try {
    const r = await fetch("/set-key", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    keyPromptDismissed = true;
    keystatus.textContent = "Saved! Schedules will appear within ~2 min.";
    setTimeout(() => fetchData().then(applyData).catch(() => {}), 1500);
    setTimeout(hideKeyPrompt, 2600);
  } catch (e) {
    keystatus.textContent = "Couldn't save — try again.";
  }
});

// First-boot placeholder so the panel isn't blank while we wait for the server.
function drawConnecting() {
  drawChrome();
  setFont(ROW_SIZE);
  ctx.textAlign = "center"; ctx.fillStyle = AMBER;
  ctx.fillText("CONNECTING…", W / 2, ROWS_TOP + 3 * ROW_H);
  ctx.textAlign = "left";
}

async function loop() {
  computeSeam();   // hinge position from the now-loaded board font
  // Wait for the server — on boot Chromium can start before serve.py is up.
  let data = null;
  while (!data) {
    if (!connected) drawConnecting();
    try { data = await fetchData(); }
    catch (e) { await sleep(2000); }
  }
  applyData(data);
  const interval = (data.refresh || 120) * 1000;
  // Poll forever; a failed poll just keeps the last board until the next one.
  setInterval(async () => {
    try { applyData(await fetchData()); } catch (e) { /* keep last frame */ }
  }, interval);
}

// Start once the board font is ready; retry the whole thing if anything throws.
function boot() {
  document.fonts.load(ROW_SIZE + "px " + FONT)
    .then(() => document.fonts.ready)
    .then(loop)
    .catch(() => { setTimeout(boot, 2000); });
}
boot();
</script>
</body>
</html>
